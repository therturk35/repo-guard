name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install pytest && pip install -e .
      - run: repo-guard selftest
      - run: python -m pytest -q
      # Kendi kendini tarama: kural katalogu doğal olarak tehlikeli dizeler içerir; bunlar
      # DEPO DIŞINDA tutulması önerilen ignore dosyasıyla, açıkça ve gerekçeli şekilde bastırılır.
      - run: repo-guard scan . --ignore-file .github/self-scan.ignore --fail-on high --format text --min-severity high
